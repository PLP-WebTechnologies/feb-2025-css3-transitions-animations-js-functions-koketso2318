<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animations and JavaScript</title>
  <style>
    .button {
      background-color: #4CAF50;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.2s ease-in-out;
    }

    .button:hover {
      transform: scale(1.1);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.2);
      }
      100% {
        box-shadow: 0 0 0 10px rgba(0, 0, 0, 0);
      }
    }

    .animate {
      animation: spin 1s;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <button class="button">Click me!</button>
  <script>
    const button = document.querySelector('.button');

    button.addEventListener('click', () => {
      button.classList.add('animate');
      setTimeout(() => {
        button.classList.remove('animate');
      }, 1000);
    });

    function storeUserPreference(prefName, prefValue) {
      localStorage.setItem(prefName, prefValue);
    }

    function retrieveUserPreference(prefName) {
      return localStorage.getItem(prefName);
    }

    // Example usage:
    button.addEventListener('dblclick', () => {
      storeUserPreference('theme', 'dark');
      const theme = retrieveUserPreference('theme');
      console.log(theme); // Output: "dark"
      if (theme === 'dark') {
        document.body.style.background = 'black';
        document.body.style.color = 'white';
      }
    });
  </script>
</body>
</html>
